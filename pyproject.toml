[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proxic-deck-builder"
version = "1.1.2"
description = "Portable desktop deck builder for Magic: The Gathering"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=10.0",
    "ReportLab>=4.0",
]

[project.optional-dependencies]
build = [
    "PyInstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["mtgdb*"]
