name: Full Scryfall Taxonomy Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read
  # Needed by the failure-alert step below, which opens a tracking issue when
  # the job fails so a new Scryfall layout/legality status, or a run that could
  # not finish at all, cannot rot unnoticed.
  issues: write
  # Needed to download the last passing run's list of values, so this run can
  # say what is new since then.
  actions: read

jobs:
  taxonomy-audit:
    # Named, not ubuntu-latest: a runner change is then a choice made here,
    # not a notice on every run.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        # The version the Windows app is built with, so the audit runs the
        # code the way it ships.
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install -e .

      - name: Fetch the last check's list of values
        # The newest passing run kept its card types, keywords, sets and so on
        # as an artifact; comparing with it is how this run lists what is new.
        # None yet (the first run, or one more than 90 days ago) only means
        # there is nothing to compare with this week.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p previous
          last=$(gh run list --workflow taxonomy-audit.yml --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
          if [ -n "$last" ]; then
            gh run download "$last" --name scryfall-taxonomy-snapshot --dir previous \
              || echo "Run $last kept no list; nothing to compare with this week."
          fi

      - name: Audit current Scryfall Default Cards snapshot
        id: audit
        run: >-
          python tests/taxonomy_audit.py --current --report taxonomy-audit.md
          --previous previous/taxonomy-snapshot.json
          --snapshot-out taxonomy-snapshot.json
          --summary-out run-summary.md --notice-out run-notice.txt

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scryfall-taxonomy-audit
          path: taxonomy-audit.md
          if-no-files-found: warn

      - name: Keep this run's list of values for the next check
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scryfall-taxonomy-snapshot
          path: taxonomy-snapshot.json
          if-no-files-found: warn
          retention-days: 90

      - name: Say what the check found
        # The run page's headline: a short summary (what was checked, what is
        # new since the last check, mana symbols without a picture) and, on a
        # pass, one plain line in Annotations -- "Nothing to do", or "Something
        # to look at" when a mana symbol has no picture. The audit writes both.
        if: always()
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [ -f run-summary.md ]; then
            cat run-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$AUDIT_OUTCOME" = "success" ] && [ -f run-notice.txt ]; then
            notice=$(cat run-notice.txt)
            echo "::notice title=${notice%%::*}::${notice#*::}"
          fi

      - name: Close an earlier alert now that the check passes
        # VER-015: an alert issue left open after the problem went away reads
        # as a problem still waiting. A passing run says so on it and closes it.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for title in "Scryfall taxonomy drift needs attention" "Scheduled Scryfall taxonomy audit could not finish"; do
            gh issue list --state open --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
              | while read -r number; do
                  gh issue close "$number" --comment "The weekly Scryfall check passes again, so this is closed: $run_url" \
                    || echo "::warning::Could not close issue #$number."
                done
          done

      - name: Open an issue and email the owner when the job fails
        # Any failure needs a person: either the audit step itself exits
        # non-zero, which happens only when current Scryfall data holds
        # something this build cannot handle -- a layout or legality status it
        # cannot classify, a new subtype group, missing card pictures (real
        # drift that needs a code change) -- or something before it broke and
        # the audit never ran (install, network, a Scryfall outage). One
        # deduplicated issue covers both. It is assigned to and mentions the
        # repository owner because an assignment or mention is what GitHub
        # always emails, whatever the owner's watch settings are -- a bare new
        # issue from the Actions bot is emailed only to people watching every
        # issue.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          AUDIT_RESULT: ${{ steps.audit.conclusion }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$AUDIT_RESULT" = "failure" ]; then
            title="Scryfall taxonomy drift needs attention"
            intro="The weekly Scryfall check found card data the app does not understand yet."
          else
            title="Scheduled Scryfall taxonomy audit could not finish"
            intro="The weekly Scryfall check stopped before it could look at the card data."
          fi
          {
            printf '@%s %s\n\n' "$OWNER" "$intro"
            if [ "$AUDIT_RESULT" = "failure" ] && [ -f run-summary.md ]; then
              cat run-summary.md
            fi
            if [ "$AUDIT_RESULT" = "failure" ] && [ -f taxonomy-audit.md ]; then
              printf '\n---\n\n'
              cat taxonomy-audit.md
            fi
            printf '\n\n---\nRun: %s\n' "$run_url"
          } > issue.md
          echo "::error title=Needs attention::${intro} An issue was opened and emailed to you."
          {
            if [ ! -f run-summary.md ]; then
              echo "## ⚠️ Needs attention"
              echo
            fi
            echo "${intro} An issue was opened and emailed to you."
          } >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
            | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md \
              || echo "::warning::Could not comment on issue #$existing."
          else
            gh issue create --title "$title" --body-file issue.md \
              --assignee "$OWNER" \
              || gh issue create --title "$title" --body-file issue.md \
              || echo "::warning::Could not open a tracking issue."
          fi
