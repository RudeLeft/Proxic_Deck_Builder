name: Full Scryfall Taxonomy Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"

permissions:
  contents: read
  # Needed by the failure-alert step below, which opens a tracking issue when
  # the job fails so a new Scryfall layout/legality status, or a run that could
  # not finish at all, cannot rot unnoticed.
  issues: write

jobs:
  taxonomy-audit:
    # Named, not ubuntu-latest: a runner change is then a choice made here,
    # not a notice on every run.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        # The version the Windows app is built with, so the audit runs the
        # code the way it ships.
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install project
        run: python -m pip install -e .

      - name: Audit current Scryfall Default Cards snapshot
        id: audit
        run: python tests/taxonomy_audit.py --current --report taxonomy-audit.md

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scryfall-taxonomy-audit
          path: taxonomy-audit.md
          if-no-files-found: warn

      - name: Say what the check found
        # The run page's headline: one plain line in Annotations and a short
        # summary, so a quiet week reads "Nothing to do" without opening the
        # report. A failure says so in the step below instead.
        if: success()
        run: |
          count() { grep -m1 "^| $1 |" taxonomy-audit.md | awk -F'|' '{gsub(/ /, "", $3); print $3}'; }
          printings=$(count "Card printing objects")
          sets=$(count "Source set codes")
          data=$(grep -m1 '^Scryfall bulk updated:' taxonomy-audit.md | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' | head -n 1)
          line="Scryfall's card data has nothing new the Deck Builder can't handle, so no update is needed. Checked ${printings} printings in ${sets} sets (Scryfall data of ${data})."
          echo "::notice title=Nothing to do::${line}"
          {
            echo "## ✅ Nothing to do"
            echo
            echo "Scryfall's card data has nothing new the Deck Builder can't handle, so no update is needed."
            echo
            echo "- Checked: ${printings} printings in ${sets} sets"
            echo "- Scryfall data from: ${data}"
            echo
            echo "The full report is the **scryfall-taxonomy-audit** file at the bottom of this page."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Close an earlier alert now that the check passes
        # VER-015: an alert issue left open after the problem went away reads
        # as a problem still waiting. A passing run says so on it and closes it.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          for title in "Scryfall taxonomy drift needs attention" "Scheduled Scryfall taxonomy audit could not finish"; do
            gh issue list --state open --json number,title \
              --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
              | while read -r number; do
                  gh issue close "$number" --comment "The weekly Scryfall check passes again, so this is closed: $run_url" \
                    || echo "::warning::Could not close issue #$number."
                done
          done

      - name: Open an issue and email the owner when the job fails
        # Any failure needs a person: either the audit step itself exits
        # non-zero, which happens only when current Scryfall data holds a layout
        # or legality status this build cannot classify (real drift that needs a
        # code change), or something before it broke and the audit never ran
        # (install, network, a Scryfall outage). One deduplicated issue covers
        # both. It is assigned to and mentions the repository owner because an
        # assignment or mention is what GitHub always emails, whatever the
        # owner's watch settings are -- a bare new issue from the Actions bot is
        # emailed only to people watching every issue.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          AUDIT_RESULT: ${{ steps.audit.conclusion }}
        run: |
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$AUDIT_RESULT" = "failure" ]; then
            title="Scryfall taxonomy drift needs attention"
            intro="The weekly Scryfall check found card data the app does not understand yet."
          else
            title="Scheduled Scryfall taxonomy audit could not finish"
            intro="The weekly Scryfall check stopped before it could look at the card data."
          fi
          {
            printf '@%s %s\n\n' "$OWNER" "$intro"
            if [ "$AUDIT_RESULT" = "failure" ] && [ -f taxonomy-audit.md ]; then
              cat taxonomy-audit.md
            fi
            printf '\n\n---\nRun: %s\n' "$run_url"
          } > issue.md
          echo "::error title=Needs attention::${intro} An issue was opened and emailed to you."
          {
            echo "## ⚠️ Needs attention"
            echo
            echo "${intro} An issue was opened and emailed to you."
          } >> "$GITHUB_STEP_SUMMARY"
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
            | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md \
              || echo "::warning::Could not comment on issue #$existing."
          else
            gh issue create --title "$title" --body-file issue.md \
              --assignee "$OWNER" \
              || gh issue create --title "$title" --body-file issue.md \
              || echo "::warning::Could not open a tracking issue."
          fi
