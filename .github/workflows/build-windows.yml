name: Build Windows App

# Build the portable Windows ONEDIR app without needing a Windows machine of your own.
# Trigger it manually from the repo's Actions tab (Run workflow), or it
# runs automatically when you push a version tag like v1.0.

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

# One build per ref. A superseded run is cancelled instead of competing for
# runners with the run that replaced it.
concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # Needed only by the tag-triggered "Publish the GitHub Release" step below;
    # the default token is read-only.
    permissions:
      contents: write
    # Optional code-signing. Set these repository secrets to sign the exe:
    # WINDOWS_CERT_BASE64 (a base64-encoded .pfx) and WINDOWS_CERT_PASSWORD.
    # Lifted to job-level env so the signing step's `if:` can test them -- a
    # secret cannot be referenced directly in an `if:` condition. Absent, the
    # signing step is skipped and the build proceeds unsigned exactly as before.
    env:
      WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full history + tags so the release step can list commits since the
          # previous version tag in the notes.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Match the version used for local builds so the packaged runtime is
          # the one actually exercised during development.
          python-version: '3.14'
          cache: 'pip'

      - name: Check the tag matches the app's version
        # REL-008. The in-app updater offers the newest release by its tag and
        # the installed app reports pyproject's version. A tag ahead of
        # pyproject would publish an app that always thinks it is out of date,
        # so a mismatched tag stops here, before anything is built.
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$version") {
            Write-Output "::error title=Tag and version differ::Tag $tag does not match pyproject.toml version $version. Bump the version, commit, and tag v<version>."
            exit 1
          }
          Write-Output "Tag $tag matches pyproject.toml version $version."

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install ".[build]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path "proxic_deck_builder.egg-info") {
            Remove-Item -Recurse -Force "proxic_deck_builder.egg-info"
          }

      - name: Run compilation and cross-platform guardrails
        shell: pwsh
        run: |
          python -m compileall -q mtgdb tests windows_tests package_release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem -Path tests -Filter "test_*.py" |
            Sort-Object Name |
            ForEach-Object {
              python $_.FullName
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }

      - name: Run Windows pre-build guardrails
        shell: pwsh
        run: |
          python windows_tests/test_single_instance_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows_tests/test_ui_geometry_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows_tests/test_app_startup_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python windows_tests/test_self_update_swap_windows.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the portable app
        run: pyinstaller ProxicDeckBuilder.spec --noconfirm

      - name: Sign the executable (only when signing secrets are set)
        if: ${{ env.WINDOWS_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP "signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfx, [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64))
          $signtool = Get-ChildItem `
            "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { Write-Error "signtool.exe not found"; exit 1 }
          & $signtool.FullName sign /f $pfx /p $env:WINDOWS_CERT_PASSWORD `
            /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 `
            "dist/ProxicDeckBuilder/ProxicDeckBuilder.exe"
          $rc = $LASTEXITCODE
          Remove-Item $pfx -Force
          if ($rc -ne 0) { exit $rc }

      - name: Run packaged portability smoke test
        run: python windows_tests/smoke_packaged_windows.py

      - name: Upload the portable app as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: ProxicDeckBuilder-windows
          # The smoke test removes dist/ProxicDeckBuilder/data after it runs. This
          # exclusion is a second line of defence: a runtime database or a saved
          # session must never be published inside the program artifact.
          path: |
            dist/ProxicDeckBuilder/
            !dist/ProxicDeckBuilder/data/
          if-no-files-found: error
          retention-days: 30

      - name: Build the source release zip
        shell: pwsh
        env:
          SOURCE_ZIP: release_dist/Proxic_Deck_Builder-${{ github.ref_name }}-source.zip
        run: |
          # Every release gate already ran in the steps above, so build the
          # source zip by reusing package_release's membership rules and zipping
          # directly instead of calling package_release.py (which would re-run
          # the whole gate suite a second time).
          @'
          import os, zipfile
          from pathlib import Path
          import package_release as p
          out = Path(os.environ["SOURCE_ZIP"]).resolve()
          out.parent.mkdir(parents=True, exist_ok=True)
          members = p.source_members(out)
          p.validate_members(members)
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as z:
              for rel in members:
                  z.write(p.ROOT / rel, (Path(p.ARCHIVE_ROOT) / rel).as_posix())
          p.validate_archive(out, expected_members=members)
          print(f"SOURCE ZIP OK: {out} ({len(members)} files)")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package the portable app as a versioned zip
        shell: pwsh
        run: |
          $zip = "release_dist/Proxic_Deck_Builder-${{ github.ref_name }}-windows.zip"
          Compress-Archive -Path "dist/ProxicDeckBuilder" -DestinationPath $zip -CompressionLevel Optimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Generate release checksums
        shell: pwsh
        run: |
          # SHA256SUMS.txt lets both the in-app updater and manual downloaders
          # verify a download. Format is the standard "<hex>  <name>" so
          # `sha256sum -c` and the app's parser both read it.
          $sums = Get-ChildItem "release_dist/*.zip" | Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.Name)"
            }
          Set-Content -Path "release_dist/SHA256SUMS.txt" -Value $sums -Encoding ascii
          Get-Content "release_dist/SHA256SUMS.txt"

      - name: Upload the release zips as artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ProxicDeckBuilder-release-zips
          path: |
            release_dist/*.zip
            release_dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish the GitHub Release
        # Only a version tag (v*) cuts a release; manual runs just leave the
        # zips as workflow artifacts above.
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # REL-009. "What's changed" is the annotated tag's own message when it
          # has one: hand-written plain-English bullets, made with
          #   git tag -a vX.Y.Z --cleanup=verbatim -F notes.txt
          # (verbatim, or git drops lines starting with '#'). Read through the
          # API, since a checkout can leave the tag lightweight locally. A tag
          # with no message falls back to the commit subjects, as before.
          $changes = $null
          $ref = gh api "repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $ref.object.type -eq "tag") {
            $message = gh api "repos/$env:GITHUB_REPOSITORY/git/tags/$($ref.object.sha)" --jq ".message"
            $message = ($message -join "`n").Trim()
            # Only a message of bullets is release notes; a one-line "Version
            # X" annotation is not.
            if ($LASTEXITCODE -eq 0 -and $message -match '(?m)^- ') {
              $changes = $message
            }
          }
          $prev = git tag --list "v*" --sort=-v:refname |
            Where-Object { $_ -ne $tag } | Select-Object -First 1
          if ($changes) {
            Write-Output "Release notes: the tag's own message."
          } elseif ($prev) {
            $changes = git log "${prev}..${tag}" --no-merges --pretty=format:"- %s" |
              Where-Object { $_ -and ($_ -notmatch 'Bump version') }
          } else {
            $changes = @("- Initial public release.")
          }
          if (-not $changes) { $changes = @("- Maintenance and internal improvements.") }
          $changesText = if ($changes -is [string]) { $changes } else { ($changes -join "`n") }
          $notes = @"
          ## What's changed

          $changesText

          ## Download and run

          - Windows app (no Python needed): Proxic_Deck_Builder-$tag-windows.zip
            Unzip, open the ProxicDeckBuilder folder, run ProxicDeckBuilder.exe. Keep the
            folder together; it is fully portable and stores its data beside the app.
          - Source (Python 3.11+): Proxic_Deck_Builder-$tag-source.zip
            Run: pip install .   then   python -m mtgdb

          Verify your download against SHA256SUMS.txt (e.g. ``sha256sum -c``).
          On first launch the app downloads current card data from Scryfall.
          Upgrading from an earlier version rebuilds the local card database once
          when its storage format changed (a one-time re-download of card data).
          "@
          gh release create "$tag" `
            "release_dist/Proxic_Deck_Builder-$tag-windows.zip" `
            "release_dist/Proxic_Deck_Builder-$tag-source.zip" `
            "release_dist/SHA256SUMS.txt" `
            --title "Proxic Deck Builder $tag" `
            --notes "$notes"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
