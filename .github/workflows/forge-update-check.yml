name: Forge Card Update Check

# Proxic Arena plays whatever card scripts its copy of Forge holds, and accepts
# only the printings Forge's editions list. This app ships both lists, so an
# export can warn about cards Arena would lose and pick printings Arena takes.
# Both lists are built from one Forge release, the one Arena runs, because
# Arena moves from release to release and refuses a card or printing that only
# Forge's unreleased work has. So this weekly check compares them with Forge's
# latest release: news means Forge has released a version Arena can move to,
# after which both lists are rebuilt from it. It tells the repository owner by
# issue.

on:
  workflow_dispatch:
  schedule:
    - cron: "43 12 * * 1"

permissions:
  contents: read
  # Needed by the alert steps below, which open, update, and close the issue.
  issues: write

jobs:
  forge-update-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Find Forge's latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/Card-Forge/forge/releases/latest --jq .tag_name)
          test -n "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Check out the card scripts and editions of Forge's latest release
        # Only those two folders, as a shallow sparse checkout: the rest of
        # Forge is large and plays no part in the comparison.
        uses: actions/checkout@v4
        with:
          repository: Card-Forge/forge
          ref: ${{ steps.release.outputs.tag }}
          path: forge-release
          sparse-checkout: |
            forge-gui/res/cardsfolder
            forge-gui/res/editions
          fetch-depth: 1

      - name: Compare Forge's latest release with the shipped Arena support list
        id: compare
        # The refresh tool is the one place the name rule lives, so this reuses
        # it in compare-only mode rather than restating the rule here. It exits
        # 1 both when the list is behind (and prints STALE) and when it could not
        # run at all, so the marker line tells the two apart: a stale list is a
        # result to report, anything else is a failure of the check itself.
        run: |
          set +e
          python tests/arena_support_refresh.py \
            --cardsfolder forge-release/forge-gui/res/cardsfolder \
            --editions forge-release/forge-gui/res/editions --check \
            | tee forge-check.txt
          code=${PIPESTATUS[0]}
          set -e
          if grep -q '^STALE:' forge-check.txt; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "stale=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Tell the owner when a Forge release has cards or printings the list lacks
        # One issue at a time, assigned to and mentioning the owner so GitHub
        # emails them. While it stays open it is only refreshed in place, so a
        # list that stays behind for weeks does not send an email every week.
        if: steps.compare.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Forge has new cards, so the Proxic Arena support list is behind"
          sha=$(git -C forge-release rev-parse HEAD)
          release="${{ steps.release.outputs.tag }}"
          {
            printf '@%s Forge has released a version whose cards or printings the Proxic Arena support list does not match yet.\n\n' "$OWNER"
            printf 'Proxic Arena plays the Forge release it runs, so the list changes only when Arena moves to this release.\n\n'
            printf 'Forge release checked: %s (https://github.com/Card-Forge/forge/commit/%s)\n\n' "$release" "$sha"
            printf '```\n'
            cat forge-check.txt
            printf '```\n\n'
            printf 'To fix it:\n\n'
            printf '1. Move Proxic Arena to this Forge release.\n'
            printf '2. Rebuild the list here from that same release with `python tests/arena_support_refresh.py --cardsfolder <its cardsfolder> --editions <its editions>`.\n'
            printf '3. Ship a new Proxic Deck Builder release.\n\n'
            printf 'This issue closes itself once the list is up to date.\n'
          } > issue.md
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
            | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --body-file issue.md \
              || echo "::warning::Could not update issue #$existing."
          else
            gh issue create --title "$title" --body-file issue.md \
              --assignee "$OWNER" \
              || gh issue create --title "$title" --body-file issue.md \
              || echo "::warning::Could not open a tracking issue."
          fi

      - name: Close the notice once the list is up to date again
        if: steps.compare.outputs.stale == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Forge has new cards, so the Proxic Arena support list is behind"
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
            | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh issue close "$existing" \
              --comment "The Proxic Arena support list matches Forge's card scripts and editions again." \
              || echo "::warning::Could not close issue #$existing."
          fi

      - name: Open an issue and email the owner when the check fails
        # The check itself could not run (Forge unreachable, a layout change in
        # its card scripts, the refresh tool refusing a near-empty result). That
        # is not "there is an update", but it means no update can be seen, so it
        # gets its own deduplicated issue rather than a silent red run.
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          title="Forge update check could not run"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            printf '@%s The weekly check for new Forge cards stopped before it could finish, so Forge updates cannot be seen until it is fixed.\n\n' "$OWNER"
            printf 'Run: %s\n' "$run_url"
          } > issue.md
          existing=$(gh issue list --state open --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" 2>/dev/null \
            | head -n 1 || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file issue.md \
              || echo "::warning::Could not comment on issue #$existing."
          else
            gh issue create --title "$title" --body-file issue.md \
              --assignee "$OWNER" \
              || gh issue create --title "$title" --body-file issue.md \
              || echo "::warning::Could not open a tracking issue."
          fi
